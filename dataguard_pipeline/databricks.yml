# This is a Declarative Automation Bundle definition for dataguard_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dataguard_pipeline
  uuid: 9e073ba5-855c-41b3-ab3a-e0a8347d19ae

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7b64eae3-cf86.cloud.databricks.com
    variables:
      catalog: dataguard
      schema: sample_data
  prod:
    mode: production
    workspace:
      host: https://dbc-7b64eae3-cf86.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/neelakshi@astreait.com to make sure we only have a single copy.
      root_path: /Workspace/Users/neelakshi@astreait.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dataguard
      schema: prod
    permissions:
      - user_name: neelakshi@astreait.com
        level: CAN_MANAGE
